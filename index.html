<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STELLAR ASSAULT — 星際突擊</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #gameCanvas {
    display: block;
    cursor: crosshair;
    image-rendering: pixelated;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<script>
// ─── SETUP ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');

const W = 800, H = 600;
canvas.width  = W;
canvas.height = H;

// ─── GAME STATE ──────────────────────────────────────────────────────────────
let state = 'start'; // 'start' | 'playing' | 'gameover'
let score = 0;
let hiScore = 0;
let frame = 0;

// ─── INPUT ───────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if ((e.code === 'Enter' || e.code === 'Space') && state !== 'playing') {
    e.preventDefault();
    startGame();
  }
  if (e.code === 'Space' && state === 'playing') {
    e.preventDefault();
    shoot();
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('click', () => {
  if (state !== 'playing') startGame();
});

// ─── STARS ───────────────────────────────────────────────────────────────────
const STAR_COUNT = 180;
const stars = Array.from({ length: STAR_COUNT }, () => ({
  x: Math.random() * W,
  y: Math.random() * H,
  r: Math.random() * 1.5 + 0.3,
  speed: Math.random() * 0.6 + 0.1,
  brightness: Math.random()
}));

function updateStars() {
  for (const s of stars) {
    s.y += s.speed;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }
}

function drawStars() {
  for (const s of stars) {
    const flicker = 0.5 + 0.5 * Math.sin(frame * 0.05 + s.brightness * 10);
    ctx.globalAlpha = 0.3 + 0.7 * flicker * s.brightness;
    ctx.fillStyle = `hsl(${200 + s.brightness * 60}, 60%, 90%)`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

// ─── PLAYER ──────────────────────────────────────────────────────────────────
const PLAYER_SPEED  = 5;
const PLAYER_SIZE   = 20;
const BULLET_COOLDOWN = 12;

let player = {};
let shootCooldown = 0;

function resetPlayer() {
  player = {
    x: W / 2,
    y: H - 70,
    w: PLAYER_SIZE * 2,
    h: PLAYER_SIZE * 2,
    alive: true,
    flashTimer: 0
  };
}

function updatePlayer() {
  if (!player.alive) return;
  const spd = PLAYER_SPEED;
  if (keys['ArrowLeft']  || keys['KeyA']) player.x -= spd;
  if (keys['ArrowRight'] || keys['KeyD']) player.x += spd;
  if (keys['ArrowUp']    || keys['KeyW']) player.y -= spd;
  if (keys['ArrowDown']  || keys['KeyS']) player.y += spd;

  player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));
  player.y = Math.max(player.h / 2, Math.min(H - player.h / 2, player.y));

  if (shootCooldown > 0) shootCooldown--;
  if (player.flashTimer > 0) player.flashTimer--;
}

function drawPlayer() {
  if (!player.alive) return;
  const { x, y } = player;
  const t = frame * 0.06;
  const glow = 12 + 6 * Math.sin(t);

  ctx.save();
  ctx.translate(x, y);

  // Engine glow / thruster
  const thrusterH = 14 + 5 * Math.sin(t * 2);
  const thrGrad = ctx.createLinearGradient(0, 10, 0, 10 + thrusterH);
  thrGrad.addColorStop(0, 'rgba(80,200,255,0.9)');
  thrGrad.addColorStop(1, 'rgba(0,100,255,0)');
  ctx.fillStyle = thrGrad;
  ctx.beginPath();
  ctx.moveTo(-8, 10);
  ctx.lineTo(8, 10);
  ctx.lineTo(4, 10 + thrusterH);
  ctx.lineTo(-4, 10 + thrusterH);
  ctx.closePath();
  ctx.fill();

  // Body glow
  if (player.flashTimer % 4 < 2 || player.flashTimer === 0) {
    ctx.shadowColor = '#44aaff';
    ctx.shadowBlur  = glow;
    ctx.fillStyle   = '#1166ff';
    ctx.beginPath();
    ctx.moveTo(0, -22);
    ctx.lineTo(-18, 12);
    ctx.lineTo(-8, 6);
    ctx.lineTo(0, 10);
    ctx.lineTo(8, 6);
    ctx.lineTo(18, 12);
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.shadowBlur = 6;
    ctx.fillStyle  = '#aaddff';
    ctx.beginPath();
    ctx.ellipse(0, -6, 5, 8, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wing accents
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur  = 10;
    ctx.strokeStyle = '#00eeff';
    ctx.lineWidth   = 1.5;
    ctx.beginPath();
    ctx.moveTo(-14, 8);
    ctx.lineTo(-6, -2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(14, 8);
    ctx.lineTo(6, -2);
    ctx.stroke();
  }

  ctx.restore();
}

// ─── BULLETS ─────────────────────────────────────────────────────────────────
let bullets = [];
const BULLET_SPEED = 12;

function shoot() {
  if (shootCooldown > 0 || !player.alive) return;
  bullets.push({ x: player.x, y: player.y - 18, w: 4, h: 14 });
  shootCooldown = BULLET_COOLDOWN;
}

function updateBullets() {
  for (const b of bullets) b.y -= BULLET_SPEED;
  bullets = bullets.filter(b => b.y + b.h > 0);
}

function drawBullets() {
  for (const b of bullets) {
    ctx.save();
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur  = 12;
    const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(0.4, '#ffff44');
    grad.addColorStop(1, 'rgba(255,200,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.roundRect(b.x - b.w / 2, b.y, b.w, b.h, 2);
    ctx.fill();
    ctx.restore();
  }
}

// ─── ENEMIES ─────────────────────────────────────────────────────────────────
let enemies = [];
let enemySpawnTimer = 0;
let enemySpawnRate  = 80; // frames between spawns (decreases over time)
let enemySpeed      = 1.8;

function spawnEnemy() {
  const size = 22 + Math.random() * 16;
  const type = Math.floor(Math.random() * 3); // 0=square, 1=diamond, 2=hex
  enemies.push({
    x: size + Math.random() * (W - size * 2),
    y: -size,
    size,
    type,
    hp: type === 2 ? 2 : 1,
    maxHp: type === 2 ? 2 : 1,
    speed: enemySpeed * (0.7 + Math.random() * 0.6),
    angle: 0,
    rotSpeed: (Math.random() - 0.5) * 0.04,
    hitFlash: 0
  });
}

function updateEnemies() {
  enemySpawnTimer++;
  if (enemySpawnTimer >= enemySpawnRate) {
    spawnEnemy();
    enemySpawnTimer = 0;
  }
  for (const e of enemies) {
    e.y += e.speed;
    e.angle += e.rotSpeed;
    if (e.hitFlash > 0) e.hitFlash--;
  }
  enemies = enemies.filter(e => e.y - e.size < H + 10);
}

function drawEnemyShape(ctx, e) {
  const s = e.size;
  ctx.beginPath();
  if (e.type === 0) {
    // Square
    ctx.rect(-s, -s, s * 2, s * 2);
  } else if (e.type === 1) {
    // Diamond
    ctx.moveTo(0, -s);
    ctx.lineTo(s, 0);
    ctx.lineTo(0, s);
    ctx.lineTo(-s, 0);
    ctx.closePath();
  } else {
    // Hexagon
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 3) * i - Math.PI / 6;
      i === 0 ? ctx.moveTo(Math.cos(a) * s, Math.sin(a) * s)
              : ctx.lineTo(Math.cos(a) * s, Math.sin(a) * s);
    }
    ctx.closePath();
  }
}

function drawEnemies() {
  for (const e of enemies) {
    ctx.save();
    ctx.translate(e.x, e.y);
    ctx.rotate(e.angle);

    const flash = e.hitFlash > 0;
    const pct = e.hp / e.maxHp;
    const hue = flash ? 60 : (e.type === 2 ? 290 : 0);
    const sat = flash ? '100%' : '80%';
    const lit = flash ? '80%' : '50%';

    ctx.shadowColor = `hsl(${hue},${sat},${lit})`;
    ctx.shadowBlur  = flash ? 30 : 18;

    // Fill
    ctx.fillStyle = `hsl(${hue},${sat},${flash ? 80 : 40}%)`;
    drawEnemyShape(ctx, e);
    ctx.fill();

    // Stroke
    ctx.strokeStyle = `hsl(${hue},100%,${flash ? 100 : 70}%)`;
    ctx.lineWidth   = 2;
    drawEnemyShape(ctx, e);
    ctx.stroke();

    // HP bar for multi-hp enemies
    if (e.maxHp > 1) {
      ctx.shadowBlur = 0;
      const bw = e.size * 2;
      ctx.fillStyle = '#333';
      ctx.fillRect(-bw / 2, -e.size - 8, bw, 4);
      ctx.fillStyle = pct > 0.5 ? '#44ff44' : '#ff8800';
      ctx.fillRect(-bw / 2, -e.size - 8, bw * pct, 4);
    }

    ctx.restore();
  }
}

// ─── PARTICLES ───────────────────────────────────────────────────────────────
let particles = [];

function explode(x, y, color) {
  const count = 14 + Math.floor(Math.random() * 10);
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1.5 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.025 + Math.random() * 0.03,
      r: 2 + Math.random() * 4,
      color
    });
  }
}

function updateParticles() {
  for (const p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.06; // slight gravity
    p.vx *= 0.97;
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);
}

function drawParticles() {
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.shadowColor = p.color;
    ctx.shadowBlur  = 8;
    ctx.fillStyle   = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ─── COLLISION DETECTION ─────────────────────────────────────────────────────
function rectsOverlap(ax, ay, aw, ah, bx, by, br) {
  // AABB vs circle approximation for enemies (use radius)
  return Math.abs(ax - bx) < (aw / 2 + br) &&
         Math.abs(ay - by) < (ah / 2 + br);
}

function checkCollisions() {
  const dead = new Set();
  const deadBullets = new Set();

  for (let bi = 0; bi < bullets.length; bi++) {
    const b = bullets[bi];
    for (let ei = 0; ei < enemies.length; ei++) {
      const e = enemies[ei];
      if (dead.has(ei)) continue;
      const dx = b.x - e.x, dy = (b.y + b.h / 2) - e.y;
      if (Math.abs(dx) < e.size && Math.abs(dy) < e.size) {
        deadBullets.add(bi);
        e.hp--;
        e.hitFlash = 6;
        if (e.hp <= 0) {
          dead.add(ei);
          explode(e.x, e.y, e.type === 2 ? '#dd44ff' : '#ff4422');
          score += 10 * e.maxHp;
          if (score > hiScore) hiScore = score;
          escalateDifficulty();
        }
      }
    }
  }

  bullets  = bullets.filter((_, i) => !deadBullets.has(i));
  enemies  = enemies.filter((_, i) => !dead.has(i));

  // Player vs enemies
  if (player.alive) {
    for (const e of enemies) {
      const dx = player.x - e.x, dy = player.y - e.y;
      if (Math.abs(dx) < e.size + 14 && Math.abs(dy) < e.size + 14) {
        player.alive = false;
        explode(player.x, player.y, '#44aaff');
        explode(player.x, player.y, '#ffffff');
        setTimeout(() => { state = 'gameover'; }, 800);
      }
    }
  }
}

function escalateDifficulty() {
  // Every 50 pts: slightly faster spawn & speed
  if (score % 50 === 0) {
    enemySpawnRate = Math.max(25, enemySpawnRate - 4);
    enemySpeed     = Math.min(5.5, enemySpeed + 0.12);
  }
}

// ─── BACKGROUND GRID ─────────────────────────────────────────────────────────
let gridOffset = 0;
function drawGrid() {
  gridOffset = (gridOffset + 0.4) % 40;
  ctx.save();
  ctx.strokeStyle = 'rgba(0, 80, 120, 0.18)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = -40 + gridOffset; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }
  ctx.restore();
}

// ─── HUD ─────────────────────────────────────────────────────────────────────
function drawHUD() {
  // Top bar
  ctx.save();
  const barGrad = ctx.createLinearGradient(0, 0, W, 0);
  barGrad.addColorStop(0, 'rgba(0,20,60,0.85)');
  barGrad.addColorStop(0.5, 'rgba(0,40,90,0.85)');
  barGrad.addColorStop(1, 'rgba(0,20,60,0.85)');
  ctx.fillStyle = barGrad;
  ctx.fillRect(0, 0, W, 44);

  ctx.strokeStyle = 'rgba(0, 180, 255, 0.4)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 44); ctx.lineTo(W, 44); ctx.stroke();

  // Score
  ctx.shadowColor = '#00eeff';
  ctx.shadowBlur  = 12;
  ctx.fillStyle   = '#00eeff';
  ctx.font        = 'bold 20px "Courier New", monospace';
  ctx.textAlign   = 'left';
  ctx.fillText(`SCORE  ${String(score).padStart(6, '0')}`, 20, 28);

  // HI score
  ctx.fillStyle  = '#ffaa00';
  ctx.shadowColor = '#ffaa00';
  ctx.textAlign  = 'center';
  ctx.fillText(`HI  ${String(hiScore).padStart(6, '0')}`, W / 2, 28);

  // Wave / difficulty
  ctx.fillStyle   = '#aa44ff';
  ctx.shadowColor = '#aa44ff';
  ctx.textAlign   = 'right';
  const diff = Math.floor((W - canvas.width * 0) + score / 50);
  ctx.fillText(`LV  ${Math.min(99, 1 + Math.floor(score / 100))}`, W - 20, 28);

  ctx.restore();
}

// ─── SCREENS ─────────────────────────────────────────────────────────────────
function drawStartScreen() {
  // Title
  ctx.save();
  ctx.textAlign = 'center';

  ctx.shadowColor = '#00eeff';
  ctx.shadowBlur  = 40;
  ctx.fillStyle   = '#00eeff';
  ctx.font        = 'bold 56px "Courier New", monospace';
  ctx.fillText('STELLAR ASSAULT', W / 2, H / 2 - 90);

  ctx.shadowColor = '#4488ff';
  ctx.shadowBlur  = 20;
  ctx.fillStyle   = '#aaddff';
  ctx.font        = '18px "Courier New", monospace';
  ctx.fillText('星際突擊', W / 2, H / 2 - 52);

  // Instructions
  ctx.shadowBlur = 0;
  ctx.fillStyle  = 'rgba(180,220,255,0.7)';
  ctx.font       = '15px "Courier New", monospace';
  const lines = [
    'W A S D / 方向鍵  ──  移動',
    'SPACE  ──  發射',
  ];
  lines.forEach((l, i) => ctx.fillText(l, W / 2, H / 2 + 10 + i * 26));

  // Blink
  if (Math.floor(frame / 30) % 2 === 0) {
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur  = 16;
    ctx.fillStyle   = '#ffff44';
    ctx.font        = 'bold 18px "Courier New", monospace';
    ctx.fillText('[ PRESS ENTER OR CLICK TO START ]', W / 2, H / 2 + 90);
  }

  if (hiScore > 0) {
    ctx.shadowBlur  = 8;
    ctx.shadowColor = '#ffaa00';
    ctx.fillStyle   = '#ffaa00';
    ctx.font        = '15px "Courier New", monospace';
    ctx.fillText(`BEST: ${String(hiScore).padStart(6, '0')}`, W / 2, H / 2 + 130);
  }

  ctx.restore();
}

function drawGameOverScreen() {
  ctx.save();

  // Overlay
  ctx.fillStyle = 'rgba(0,0,10,0.65)';
  ctx.fillRect(0, 0, W, H);

  ctx.textAlign   = 'center';
  ctx.shadowColor = '#ff2222';
  ctx.shadowBlur  = 50;
  ctx.fillStyle   = '#ff4444';
  ctx.font        = 'bold 68px "Courier New", monospace';
  ctx.fillText('GAME OVER', W / 2, H / 2 - 60);

  ctx.shadowColor = '#ffffff';
  ctx.shadowBlur  = 10;
  ctx.fillStyle   = '#ffffff';
  ctx.font        = '22px "Courier New", monospace';
  ctx.fillText(`FINAL SCORE  ${String(score).padStart(6, '0')}`, W / 2, H / 2);

  if (score >= hiScore && score > 0) {
    ctx.shadowColor = '#ffff00';
    ctx.shadowBlur  = 20;
    ctx.fillStyle   = '#ffff44';
    ctx.font        = 'bold 16px "Courier New", monospace';
    ctx.fillText('★  NEW HIGH SCORE  ★', W / 2, H / 2 + 34);
  }

  if (Math.floor(frame / 30) % 2 === 0) {
    ctx.shadowColor = '#00eeff';
    ctx.shadowBlur  = 16;
    ctx.fillStyle   = '#00eeff';
    ctx.font        = 'bold 16px "Courier New", monospace';
    ctx.fillText('[ PRESS ENTER OR CLICK TO RETRY ]', W / 2, H / 2 + 90);
  }

  ctx.restore();
}

// ─── GAME LIFECYCLE ──────────────────────────────────────────────────────────
function startGame() {
  score           = 0;
  frame           = 0;
  bullets         = [];
  enemies         = [];
  particles       = [];
  enemySpawnTimer = 0;
  enemySpawnRate  = 80;
  enemySpeed      = 1.8;
  shootCooldown   = 0;
  resetPlayer();
  state = 'playing';
}

// ─── MAIN LOOP ───────────────────────────────────────────────────────────────
function loop() {
  requestAnimationFrame(loop);
  frame++;

  // Background
  ctx.fillStyle = '#01010f';
  ctx.fillRect(0, 0, W, H);

  drawGrid();
  updateStars();
  drawStars();

  if (state === 'start') {
    drawStartScreen();
    return;
  }

  if (state === 'playing') {
    updatePlayer();
    updateBullets();
    updateEnemies();
    checkCollisions();
  }

  updateParticles();

  drawEnemies();
  drawBullets();
  drawPlayer();
  drawParticles();
  drawHUD();

  if (state === 'gameover') {
    drawGameOverScreen();
  }
}

loop();
</script>
</body>
</html>
